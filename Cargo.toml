[package]
name = "aerowm"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
dirs = "6.0.0"
hex_color = "3.0.0"
image = "0.25.10"
mlua = {version = "0.11.6", features = ["lua54", "vendored"]}
notify = "8.2.0"
rustix = "1.1.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "net", "macros", "io-util", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcursor = "0.3.10"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
branch = "master"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "use_system_lib",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session",
    "backend_session_libseat",
    "xwayland",
]
